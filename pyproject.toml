[project]
name = "elis-procurement-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
elis-procurement-v2 = "elis_procurement_v2:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
    "tasky>=0.8.1",
]

[tool.ruff]
line-length = 89
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.taskipy.tasks]

# Qualidade do código
format = { cmd = "ruff format .", help = "Formata o codigo Python" }
lint = { cmd = "ruff check .", help = "Verifica problemas com Ruff" }
fix = { cmd = "ruff check . --fix", help = "Corrige problemas identificados pelo Ruff" }
check = { cmd = "ruff format --check . && ruff check .", help = "Valida formatacao e lint" }
test = { cmd = "pytest --cov=elis_procurement_v2 --cov-report=term-missing --cov-report=html", help = "Executa os testes com cobertura" }

# Processamento das faturas
invoice = { cmd = "python scripts/process_one_invoice.py", help = "Processa uma fatura informada por argumento" }
batch = { cmd = "python scripts/process_batch.py", help = "Simula o processamento em lote" }
batch_run = { cmd = "python scripts/process_batch.py --execute", help = "Executa processamento real de ate 2 faturas" }

# Relatorios
report = { cmd = "python scripts/report_processed.py", help = "Exibe o relatorio consolidado das faturas" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["elis_procurement_v2"]

[tool.coverage.report]
show_missing = true
