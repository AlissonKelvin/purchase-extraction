[project]
name = "elis-procurement-v2"
version = "0.1.0"
description = "Invoice extraction, reconciliation, and procurement data export pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
elis-procurement-v2 = "elis_procurement_v2:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
    "tasky>=0.8.1",
]

[tool.ruff]
line-length = 89
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.taskipy.tasks]

# Code quality
format = { cmd = "ruff format .", help = "Format the Python code" }
lint = { cmd = "ruff check .", help = "Check the code with Ruff" }
fix = { cmd = "ruff check . --fix", help = "Fix issues reported by Ruff" }
check = { cmd = "ruff format --check . && ruff check .", help = "Validate formatting and lint rules" }
test = { cmd = "pytest --cov=elis_procurement_v2 --cov-report=term-missing --cov-report=html", help = "Run the test suite with coverage" }

# Invoice processing
invoice = { cmd = "python scripts/process_one_invoice.py", help = "Process the invoice passed as an argument" }
batch = { cmd = "python scripts/process_batch.py", help = "Preview a batch run without processing invoices" }
batch_run = { cmd = "python scripts/process_batch.py --execute", help = "Process up to two invoices" }

# Reports
report = { cmd = "python scripts/report_processed.py", help = "Display the consolidated invoice report" }

# Export
export = { cmd = "python scripts/export_procurement.py", help = "Export the proof-of-concept data to CSV" }

# Audit
audit_csv = { cmd = "python scripts/audit_procurement_csv.py", help = "Audit the exported proof-of-concept CSV files" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["elis_procurement_v2"]

[tool.coverage.report]
show_missing = true
